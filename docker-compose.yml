services:
  # 1. Base de datos PostgreSQL local
  postgres-db:
    image: postgres:15
    container_name: coworking-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: coworking_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coworking_db"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: always

  # 2. Servicio de Usuarios (FastAPI)
  users-service:
    build:
      context: ./services/users-service
      dockerfile: Dockerfile
    container_name: coworking-users-service
    environment:
      - DATABASE_URL=postgresql+psycopg2://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres-db:5432/coworking_db
      - SECRET_KEY=coworking_secret_key_change_me_in_prod
    ports:
      - "8000:8000"
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: always

  # 3. Servicio de Reservas (Rust / Axum)
  reservations-service:
    build:
      context: ./services/reservations-service
      dockerfile: Dockerfile
    container_name: coworking-reservations-service
    environment:
      - DATABASE_URL=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres-db:5432/coworking_db
      - SECRET_KEY=coworking_secret_key_change_me_in_prod
      - PORT=8003
      - RUST_LOG=reservations_service=debug,tower_http=debug,sqlx=warn
    ports:
      - "8003:8003"
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: always

  # 4. Servicio de Espacios (Golang)
  space-service:
    build:
      context: ./services/space-service
      dockerfile: Dockerfile
    container_name: coworking-space-service
    environment:
      - PORT=8081
      - DATABASE_URL=postgresql+psycopg2://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres-db:5432/coworking_db
      - SECRET_KEY=coworking_secret_key_change_me_in_prod
    ports:
      - "8081:8081"
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: always

  # 4. Servicio de Facturación y Reportes (Node.js/Express)
  billing-service:
    build:
      context: ./services/billing-service
      dockerfile: Dockerfile
    container_name: coworking-billing-service
    environment:
      - PORT=8082
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@postgres-db:5432/coworking_db
      - SECRET_KEY=coworking_secret_key_change_me_in_prod
    ports:
      - "8082:8082"
    depends_on:
      - postgres-db
    restart: always

  # 5. Frontend Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: coworking-frontend
    ports:
      - "3000:3000"
    environment:
      - USERS_SERVICE_URL=http://users-service:8000
      - SPACE_SERVICE_URL=http://space-service:8081
      - RESERVATIONS_SERVICE_URL=http://reservations-service:8003
      - BILLING_SERVICE_URL=http://billing-service:8082
    depends_on:
      - users-service
      - space-service
      - reservations-service
      - billing-service
    restart: always

volumes:
  postgres_data: